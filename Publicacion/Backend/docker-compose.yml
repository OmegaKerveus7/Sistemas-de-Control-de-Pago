services:
  backend-parqueo-belen:
    restart: "no"
    image: img-parqueo-belen-backend:1
    container_name: cont-parqueo-belen-backend
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api/publish:/app
      - /app/node_modules
    ports:
      - "5299:8080"
    environment:
      - NODE_ENV=development
      - BUN_ENV=development
      - PORT=8080
      - DATABASE_URL=oracle://system:serverBD@host.docker.internal:1521/XE
      - FRONTEND_BASE_URL=https://parqueobelen.site
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - red-parqueo-belen

networks:
  red-parqueo-belen:
    name: red-parqueo-belen
    driver: bridge