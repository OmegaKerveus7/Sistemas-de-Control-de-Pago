services:
  frontend-parqueo-belen:
    restart: "no"
    image: img-parqueo-belen-frontend:1
    container_name: cont-parqueo-belen-frontend
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    volumes:
      - ./front/sitio_web:/app
      - /app/node_modules
    ports:
      - "5147:5147"
    environment:
      - NODE_ENV=development
      - BUN_ENV=development
      - VITE_API_URL=/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - red-parqueo-belen

networks:
  red-parqueo-belen:
    name: red-parqueo-belen
    driver: bridge
    external: true